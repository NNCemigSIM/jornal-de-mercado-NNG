name: Atualizar Jornal de Mercado

on:
  schedule:
    # horário de Brasília não tem horário de verão desde 2019, então é sempre UTC-3:
    - cron: "0 9 * * *"   # 09:00 UTC = 06:00 em Brasília
    - cron: "0 21 * * *"  # 21:00 UTC = 18:00 em Brasília
  workflow_dispatch: {}   # botão "Run workflow" na aba Actions, pra rodar na hora sem esperar o horário

permissions:
  contents: write   # precisa pra dar commit/push do dados/jornal.json atualizado

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar notícias e cotações
        run: node scripts/atualizar_jornal.mjs

      - name: Publicar dados/jornal.json (se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/jornal.json
          git diff --cached --quiet && echo "Nada novo, nao precisa de commit." || git commit -m "Atualiza jornal de mercado"
          git push
